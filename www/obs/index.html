<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bani Overlay</title>
  <link rel="stylesheet" href="bundle.css" />
  <script src="socket.io.js"></script>
  <script src="fitty.js"></script>

  <script>
    const getElements = (selector) => {
      const elements = document.querySelectorAll(selector);
      return {
        elements: elements,
        setProperty: (property, value) => {
          elements.forEach(element => {
            if (property in element.style) {
              element.style[property] = value;
            } else {
              element[property] = value;
            }
          });
        },
      };
    };

    const previewData = {
      English: 'If the Lord shows His Mercy, then I keep Him enshrined within my heart. ||1||',
      Hindi: 'यदि प्रभु अपनी कृपा करे, तो मैं उसे अपने हृदय में बसा रखूँ। ||1||',
      Gurmukhi: 'ik®pw kry jy AwpxI qw hir rKw aur Dwir ]1]',
      PageNo: 589,
      Punjabi: 'jy prmwqmw AwpxI myhr kry, qW mYN BI aus dw nwm ihrdy ivc pro r`KW [1[',
      Raag: {
        RaagEnglish: 'Raag Vadhans',
        RaagGurmukhi: 'rwgu vfhMsu',
        RaagWithPage: 'Vadhans (557-594)',
      },
      Source: {
        SourceEnglish: 'Sri Guru Granth Sahib Ji',
        SourceGurmukhi: 'sRI gurU gRMQ swihb jI',
      },
      Spanish: 'Cuando el Señor así nos bendice, enaltecemos al Guru en la mente. (1)',
      Translations:
        '{"en":{"bdb":"If the Lord shows His Mercy, then I keep Him enshrined within my heart. ||1||"},"pu":{"ss":"jy prmwqmw AwpxI myhr kry, qW mYN BI aus dw nwm ihrdy ivc pro r`KW [1[","ft":"jy hrI ApnI ikRpw kry qW mYN iqs hir ky nwm ko aur myN Dwrn kr rKW]1]","bdb":"jy prmwqmw AwpxI myhr kry, qW mYN BI aus dw nwm ihrdy ivc pro r`KW [1["},"puu":{"ss":"ਜੇ ਪਰਮਾਤਮਾ ਆਪਣੀ ਮੇਹਰ ਕਰੇ, ਤਾਂ ਮੈਂ ਭੀ ਉਸ ਦਾ ਨਾਮ ਹਿਰਦੇ ਵਿਚ ਪਰੋ ਰੱਖਾਂ ।੧।","ft":"ਜੇ ਹਰੀ ਅਪਨੀ ਕ੍ਰਿਪਾ ਕਰੇ ਤਾਂ ਮੈਂ ਤਿਸ ਹਰਿ ਕੇ ਨਾਮ ਕੋ ਉਰ ਮੇਂ ਧਾਰਨ ਕਰ ਰਖਾਂ॥੧॥","bdb":"ਜੇ ਪਰਮਾਤਮਾ ਆਪਣੀ ਮੇਹਰ ਕਰੇ, ਤਾਂ ਮੈਂ ਭੀ ਉਸ ਦਾ ਨਾਮ ਹਿਰਦੇ ਵਿਚ ਪਰੋ ਰੱਖਾਂ ।੧।"},"es":{"sn":"Cuando el Señor así nos bendice, enaltecemos al Guru en la mente. (1)"},"hi":{"ss":"यदि प्रभु अपनी कृपा करे, तो मैं उसे अपने हृदय में बसा रखूँ। ||1||"}}',
      Transliteration: {
        Devanagari: 'कृपा करे जे आपणी ता हरि रखा उर धारि ॥१॥',
        English: 'kirapaa kare je aapanee taa har rakhaa ur dhaar ||1||',
        Shahmukhi: 'کِ®پا کرے جے آپنی تا هر رکھا اُر دھار ۔۔۱۔۔',
      },
      Visraam: '{"sttm": [], "igurbani": [], "sttm2": [{"p": 3, "t": "v"}]}',
      Writer: {
        WriterEnglish: 'Guru Amar Daas Ji',
        WriterGurmukhi: 'mÚ 3',
      },
    };
    const socket = io();
    const preview = document.location.href.indexOf('preview') > -1;
    let overlayPrefs;
    let hasAnnouncement = false;
    let lineBeforeAnnouncement = {};
    let lastAnnouncement = {};
    let fitTextInstances = [];

    const hexToRgb = hex => {
      if (hex === '#000') {
        return '0, 0, 0';
      }
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

      return result
        ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}`
        : null;
    };

    const assist = (line, overlayLarivaar, larivaarAssist) => {
      return line
        .split(' ')
        .map((word, index) => {
          let className = 'normal';
          if (overlayLarivaar && larivaarAssist) {
            className = index % 2 == 0 ? 'normal' : 'light';
          }
          return `<span class="${className}-word">${word}</span>`;
        })
        .join(overlayLarivaar ? '' : ' ');
    };

    const mapTransliterationKey = (language) => {
      if (language === 'Hindi' || language === 'Devanagari') {
        return 'Devanagari';
      }
      if (language === 'Shahmukhi' || language === 'Punjabi') {
        return 'Shahmukhi';
      }
      return 'English';
    };

    const getLanguageSettings = (languageSettings) => {
      // Overlay UI prefs always win over legacy languageSettings from app.js
      const translation =
        (overlayPrefs && overlayPrefs.translationLanguage) ||
        (languageSettings && languageSettings.translation) ||
        'English';
      const transliterationLang =
        (overlayPrefs && overlayPrefs.transliterationLanguage) ||
        (languageSettings && languageSettings.transliteration) ||
        'English';
      return {
        translation,
        transliteration: mapTransliterationKey(transliterationLang),
      };
    };

    const getTranslationText = (Line, translationLang) => {
      if (!Line) return '';
      if (translationLang === 'Hindi') {
        return Line.Hindi || Line.hindi || '';
      }
      if (translationLang === 'Spanish') {
        return Line.Spanish || Line.spanish || '';
      }
      return Line.English || Line.english || '';
    };

    const getTransliterationText = (Line, transliterationKey) => {
      if (!Line || !Line.Transliteration) return '';
      if (typeof Line.Transliteration === 'string') {
        return transliterationKey === 'English' ? Line.Transliteration : '';
      }
      return (
        Line.Transliteration[transliterationKey] ||
        Line.Transliteration[transliterationKey.toLowerCase()] ||
        ''
      );
    };

    const writeLine = (Line, larivaar, larivaarAssist, languageSettings) => {
      lineBeforeAnnouncement = { Line, larivaar, larivaarAssist, languageSettings };
      getElements('.o-gurbani').setProperty('innerHTML',
        assist(Line.Gurmukhi || '', larivaar, larivaarAssist));

      const resolvedLanguage = getLanguageSettings(languageSettings);
      const translation = getTranslationText(Line, resolvedLanguage.translation);
      const transliteration = getTransliterationText(Line, resolvedLanguage.transliteration);

      getElements('.o-translation').setProperty('innerHTML', translation);
      getElements('.o-teeka').setProperty('innerHTML', Line.Punjabi || '');
      getElements('.o-transliteration').setProperty('innerHTML', transliteration);

      applyContentLanguageClasses(resolvedLanguage);
      applyContentVisibility();

      document.querySelector('.overlay-wrapper').hidden =
        Line.Gurmukhi === '' && !translation;
    };

    const writeText = (text, isGurmukhi, isAnnouncement) => {
      let htmlCode;
      if (isAnnouncement && !isGurmukhi) {
        htmlCode = `<span>${text}</span>`;
        getElements('.o-translation').setProperty('innerHTML', htmlCode);
        getElements('.o-gurbani').setProperty('innerHTML', '');
      } else {
        htmlCode = `<span>${text}</span>`;
        getElements('.o-gurbani').setProperty('innerHTML', htmlCode);
        getElements('.o-translation').setProperty('innerHTML', '');
      }
      document.querySelectorAll('.o-teeka').forEach(el => {
        el.innerHTML = '';
      });
      document.querySelectorAll('.o-transliteration').forEach(el => {
        el.innerHTML = '';
      });
    };

    const applyContentLanguageClasses = (resolvedLanguage) => {
      const translationLang = (resolvedLanguage && resolvedLanguage.translation) || 'English';
      const transliterationKey =
        (resolvedLanguage && resolvedLanguage.transliteration) || 'English';

      document.querySelectorAll('.o-translation').forEach(el => {
        el.classList.toggle('hindi', translationLang === 'Hindi');
        el.classList.toggle('spanish', translationLang === 'Spanish');
        if (translationLang === 'Hindi') {
          el.setAttribute('lang', 'hi');
        } else if (translationLang === 'Spanish') {
          el.setAttribute('lang', 'es');
        } else {
          el.setAttribute('lang', 'en');
        }
      });

      document.querySelectorAll('.o-transliteration').forEach(el => {
        el.classList.toggle('devanagari', transliterationKey === 'Devanagari');
        el.classList.toggle('shahmukhi', transliterationKey === 'Shahmukhi');
        if (transliterationKey === 'Devanagari') {
          el.setAttribute('lang', 'hi');
        } else if (transliterationKey === 'Shahmukhi') {
          el.setAttribute('lang', 'pa-Arab');
        } else {
          el.setAttribute('lang', 'en');
        }
      });
    };

    const applyContentVisibility = () => {
      if (!overlayPrefs) {
        return;
      }

      const showTranslation = overlayPrefs.translationVisibility !== false;
      const showTransliteration = overlayPrefs.transliterationVisibility !== false;
      const layout = overlayPrefs.layout || 'split';
      const alwaysAllowTranslit = ['split', 'vertical', 'vertical-left', 'fullscreen'].includes(
        layout,
      );

      document.querySelectorAll('.o-translation').forEach(el => {
        el.style.display = showTranslation ? '' : 'none';
      });

      document.querySelectorAll('.o-transliteration').forEach(el => {
        // Keep layout defaults for classic/top/bottom unless visibility is on and content exists
        if (!showTransliteration) {
          el.style.display = 'none';
        } else if (alwaysAllowTranslit || layout === 'top' || layout === 'bottom') {
          el.style.display = el.innerHTML ? 'block' : 'none';
        } else {
          el.style.display = '';
        }
      });
    };

    const getTextSize = (sizeKey, fallback = 3) => {
      if (!overlayPrefs) {
        return fallback;
      }
      if (preview && overlayPrefs.fitTextSwitch) {
        return fallback;
      }
      const size = overlayPrefs[sizeKey];
      if (size !== undefined && size !== null) {
        return size;
      }
      return overlayPrefs.textSize || fallback;
    };

    const applyOverlayPrefs = () => {
      if (!overlayPrefs) {
        return;
      }
      const layout = overlayPrefs.layout || 'split';
      const overlayColor = overlayPrefs.greenScreenToggle ? '#0f0' : 'transparent';
      const bgOpacity = Number(overlayPrefs.greenScreenToggle) || overlayPrefs.bgOpacity;
      const translationSize = getTextSize('translationSize', 3);
      const transliterationSize = getTextSize('transliterationSize', 3);

      const layoutContainer = document.querySelector('.layout-top-bottom');
      layoutContainer.style.color = overlayPrefs.textColor;
      layoutContainer.style.fontSize = `${translationSize}vh`;
      layoutContainer.style.padding = `${overlayPrefs.fitTextSwitch ? '1vh 5%' : `${overlayPrefs.padding}vh 5%`}`;
      layoutContainer.style.backgroundColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;

      document.querySelectorAll('.content-top, .content-bottom').forEach(el => {
        el.style.color = overlayPrefs.textColor;
        el.style.fontSize = `${translationSize}vh`;
        el.style.padding = `${overlayPrefs.fitTextSwitch ? '1vh 5%' : `${overlayPrefs.padding}vh 5%`}`;
        el.style.backgroundColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;
      });

      document.querySelector('.logo-wrapper') &&
        (document.querySelectorAll('.logo-wrapper').forEach(el => {
          el.style.opacity = overlayPrefs.bgOpacity;
        }));

      getElements('.o-gurbani').setProperty('color', overlayPrefs.gurbaniTextColor);
      getElements('.o-gurbani').setProperty('fontSize',
        `${(preview && overlayPrefs.fitTextSwitch) ? 5 : overlayPrefs.gurbaniSize}vh`);

      getElements('.o-translation').setProperty('fontSize', `${translationSize}vh`);
      getElements('.o-transliteration').setProperty('fontSize', `${transliterationSize}vh`);
      getElements('.o-translation').setProperty('color', overlayPrefs.textColor);
      getElements('.o-transliteration').setProperty('color', overlayPrefs.textColor);

      if (!preview && ['top', 'bottom'].includes(layout)) {
        if (overlayPrefs.fitTextSwitch) {
          fitTextInstances = fitty('.layout-top-bottom .o-gurbani', {
            minSize: 18,
            maxSize: 36,
          });
          fitTextInstances.push(...fitty('.layout-top-bottom .o-translation', {
            minSize: 14,
            maxSize: 24,
            multiLine: true,
          }));
        } else {
          if (fitTextInstances && fitTextInstances.length > 0) {
            fitTextInstances[0].unsubscribe();
            fitTextInstances = fitTextInstances[1].unsubscribe();
            document.querySelector('.layout-top-bottom .o-gurbani').style.whiteSpace = 'normal';
            document.querySelector('.layout-top-bottom .o-translation').style.whiteSpace = 'normal';
            document.querySelector('.layout-top-bottom .o-translation').style.fontSize = 'inherit';
          }
        }
      }

      document.body.classList.remove(
        'layout-top',
        'layout-bottom',
        'layout-split',
        'layout-classic',
        'layout-vertical',
        'layout-vertical-left',
        'layout-fullscreen',
      );

      const { gurbaniFont, textFont, toggleAnnouncement } = overlayPrefs;
      getElements('.o-gurbani').setProperty('fontFamily', gurbaniFont);
      getElements('.o-translation').setProperty('fontFamily', textFont);
      getElements('.o-transliteration').setProperty('fontFamily', textFont);

      // Hindi/Devanagari keep dedicated font stacks via CSS classes
      document.querySelectorAll('.o-translation.hindi, .o-transliteration.devanagari').forEach(el => {
        el.style.fontFamily = '';
      });

      document.body.classList.add('layout-' + layout);

      if (['top', 'bottom'].includes(layout)) {
        document.querySelector('.layout-top-bottom').style.display = 'flex';
        document.querySelector('.other-layouts').style.display = 'none';
      } else {
        document.querySelector('.other-layouts').style.display = 'block';
        document.querySelector('.layout-top-bottom').style.display = 'none';
      }
      document.body.classList.toggle('logo-off', !overlayPrefs.toggleLogo);

      // Prefer announcement only when one is actively showing; otherwise always
      // refresh verse content so language / visibility prefs apply immediately.
      if (
        toggleAnnouncement &&
        hasAnnouncement &&
        Object.keys(lastAnnouncement).length
      ) {
        const { text, isGurmukhi, isAnnouncement } = lastAnnouncement;
        writeText(text, isGurmukhi, isAnnouncement);
      } else if (Object.keys(lineBeforeAnnouncement).length) {
        const { Line, larivaar, larivaarAssist, languageSettings } = lineBeforeAnnouncement;
        const resolvedLanguage = getLanguageSettings(languageSettings);
        const translationText = getTranslationText(Line, resolvedLanguage.translation);
        const transliterationText = getTransliterationText(
          Line,
          resolvedLanguage.transliteration,
        );

        getElements('.o-gurbani').setProperty(
          'innerHTML',
          assist(Line.Gurmukhi || '', larivaar, larivaarAssist),
        );
        getElements('.o-translation').setProperty('innerHTML', translationText);
        getElements('.o-teeka').setProperty('innerHTML', Line.Punjabi || '');
        getElements('.o-transliteration').setProperty('innerHTML', transliterationText);
        applyContentLanguageClasses(resolvedLanguage);
      }

      document.querySelectorAll('.content-top, .content-bars-bottom').forEach(el => {
        // Clear styles added by other overrides
        document.querySelectorAll('span.o-gurbani, span.o-translation').forEach(spanEl => {
          spanEl.style.backgroundColor = 'transparent';
        });
        document.querySelector('.overlay-wrapper').style.backgroundColor = 'transparent';
      });

      // Special style overrides for vertical layout
      document
        .querySelectorAll(
          '.layout-vertical .overlay-wrapper, .layout-vertical-left .overlay-wrapper',
        )
        .forEach(el => {
          document.querySelectorAll('.content-top, .content-bottom').forEach(content => {
            content.style.backgroundColor = 'transparent';
            content.style.padding = '0';
          });
          el.style.width = `${overlayPrefs.padding} * 10%`;
          el.style.backgroundColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;
        });

      // Special style overrides for classic layout
      document
        .querySelectorAll('.layout-classic .content-top, .layout-classic .content-bottom')
        .forEach(el => {
          el.style.backgroundColor = 'transparent';
          const overlayBgColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;
          el.style.padding = '0';

          document.querySelectorAll('span.o-gurbani, span.o-translation').forEach(spanEl => {
            spanEl.style.backgroundColor = overlayBgColor;
            spanEl.style.padding = `${overlayPrefs.padding}vh`;
            spanEl.style.lineHeight = '1.5em';
          });
          document.querySelector('.overlay-wrapper').style.backgroundColor = 'transparent';
        });

      // Fullscreen layout (viewer-like)
      document.querySelectorAll('.layout-fullscreen .overlay-wrapper').forEach(el => {
        el.style.backgroundColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;
        document.querySelectorAll('.content-top, .content-bottom').forEach(content => {
          content.style.backgroundColor = 'transparent';
          content.style.padding = '0';
        });
      });

      document.body.style.backgroundColor = overlayColor;

      // Apply the font weight and italic to translation and transliteration
      const textFormat = overlayPrefs.textFormat || { bold: false, italic: false };
      document.querySelectorAll('span.o-translation, span.o-transliteration').forEach(el => {
        const isDevanagari = el.classList.contains('hindi') || el.classList.contains('devanagari');
        if (isDevanagari) {
          el.style.fontWeight = 'normal';
          el.style.fontStyle = textFormat.italic ? 'italic' : 'normal';
          el.style.fontSynthesis = 'none';
        } else {
          el.style.fontWeight = textFormat.bold ? 900 : 400;
          el.style.fontStyle = textFormat.italic ? 'italic' : 'normal';
        }
      });

      applyContentVisibility();
    };

    socket.on('show-line', request => {
      if (!preview) {
        const overlayLarivaar = overlayPrefs ? overlayPrefs.overlayLarivaar : false;
        const larivaarAssist = overlayPrefs ? overlayPrefs.larivaarAssist : false;
        writeLine(request.Line, overlayLarivaar, larivaarAssist, request.languageSettings);
        if (overlayPrefs) {
          applyOverlayPrefs();
        }
      }
    });

    socket.on('show-misc-text', request => {
      if (!preview) {
        if (overlayPrefs) {
          const { text, isGurmukhi, isAnnouncement } = request;
          writeText(text, isGurmukhi, isAnnouncement);
          if (isAnnouncement) {
            hasAnnouncement = true;
            lastAnnouncement = { text, isGurmukhi, isAnnouncement };
          } else {
            hasAnnouncement = false;
          }
          applyOverlayPrefs();
        }
      }
    });

    socket.on('update-prefs', data => {
      // Merge so a partial prefs payload never drops layout / other settings
      overlayPrefs = { ...(overlayPrefs || {}), ...data };
      applyOverlayPrefs();
    });
  </script>
</head>

<body class="layout-bottom bani-overlay-page">
  <section class="overlay-wrapper">
    <div class="layout-top-bottom">
      <div class="content-bar ">
        <div><span class="gurmukhi o-gurbani"> </span></div>
        <div><span class="o-transliteration"> </span></div>
        <div><span class="o-translation"> </span></div>
      </div>
      <div class="logo-wrapper" >
        <img alt="SikhiToTheMax" src="./sikhi-max-logo-white.png" class="sttm-logo-white" />
      </div>
    </div>
    <div class="other-layouts">
      <div class="content-top">
        <div class="content-bar ">
          <div><span class="gurmukhi o-gurbani"> </span></div>
        </div>
        <div class="content-bar"><span class=" o-teeka"> </span></div>
      </div>
      <div class="content-bars-bottom">
        <div class="content-bottom">
          <div class="content-bar"><span class="o-transliteration"> </span></div>
          <div class="content-bar">
            <div><span class="o-translation"> </span></div>
          </div>
        </div>
        <div class="logo-wrapper">
          <img alt="SikhiToTheMax" src="./sikhi-max-logo-white.png" class="sttm-logo-white" />
        </div>
      </div>
    </div>
  </section>
  <!-- TODO: Refactor the above code to use gurbani and translation divs for each layout -->
  <script type="text/javascript">
    if (preview) {
      writeLine(previewData);
    }
  </script>
</body>

</html>
