<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bani Overlay</title>
  <link rel="stylesheet" href="bundle.css" />
  <script src="socket.io.js"></script>
  <script src="fitty.js"></script>

  <script>
    const getElements = (selector) => {
      const elements = document.querySelectorAll(selector);
      return {
        elements: elements,
        setProperty: (property, value) => {
          elements.forEach(element => {
            if (property in element.style) {
              element.style[property] = value;
            } else {
              element[property] = value;
            }
          });
        },
      };
    };

    const previewData = {
      English: 'If the Lord shows His Mercy, then I keep Him enshrined within my heart. ||1||',
      Hindi: 'यदि प्रभु अपनी कृपा करे, तो मैं उसे अपने हृदय में बसा रखूँ। ||1||',
      Gurmukhi: 'ik®pw kry jy AwpxI qw hir rKw aur Dwir ]1]',
      PageNo: 589,
      Punjabi: 'jy prmwqmw AwpxI myhr kry, qW mYN BI aus dw nwm ihrdy ivc pro r`KW [1[',
      Spanish: 'Cuando el Señor así nos bendice, enaltecemos al Guru en la mente. (1)',
      Transliteration: {
        Devanagari: 'कृपा करे जे आपणी ता हरि रखा उर धारि ॥१॥',
        English: 'kirapaa kare je aapanee taa har rakhaa ur dhaar ||1||',
        Shahmukhi: 'کِ®پا کرے جے آپنی تا هر رکھا اُر دھار ۔۔۱۔۔',
      },
    };
    const socket = io();
    const preview = document.location.href.indexOf('preview') > -1;
    let overlayPrefs;
    let hasAnnouncement = false;
    let lineBeforeAnnouncement = {};
    let lastAnnouncement = {};
    let fitTextInstances = [];

    const DEFAULT_CONTENTS = [
      'translation-english',
      'transliteration-english',
      'teeka-punjabi',
    ];

    const hexToRgb = hex => {
      if (hex === '#000') {
        return '0, 0, 0';
      }
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

      return result
        ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}`
        : null;
    };

    const assist = (line, overlayLarivaar, larivaarAssist) => {
      return (line || '')
        .split(' ')
        .map((word, index) => {
          let className = 'normal';
          if (overlayLarivaar && larivaarAssist) {
            className = index % 2 == 0 ? 'normal' : 'light';
          }
          return `<span class="${className}-word">${word}</span>`;
        })
        .join(overlayLarivaar ? '' : ' ');
    };

    // Migrate legacy translation/transliteration language prefs into content slots
    const getContentSlots = () => {
      if (!overlayPrefs) {
        return DEFAULT_CONTENTS.map((content, index) => ({
          content,
          visible: index < 2,
          size: 3,
        }));
      }

      // New content-slot model
      if (overlayPrefs.content1 || overlayPrefs.content2 || overlayPrefs.content3) {
        return [1, 2, 3].map((n) => ({
          content: overlayPrefs[`content${n}`] || DEFAULT_CONTENTS[n - 1],
          visible: overlayPrefs[`content${n}Visibility`] !== false,
          size: overlayPrefs[`content${n}Size`] != null
            ? overlayPrefs[`content${n}Size`]
            : (overlayPrefs.textSize || 3),
        }));
      }

      // Legacy model fallback
      const translationLang = (overlayPrefs.translationLanguage || 'English').toLowerCase();
      const transliterationLang = (overlayPrefs.transliterationLanguage || 'English').toLowerCase();
      return [
        {
          content: `translation-${translationLang}`,
          visible: overlayPrefs.translationVisibility !== false,
          size: overlayPrefs.translationSize || overlayPrefs.textSize || 3,
        },
        {
          content: `transliteration-${transliterationLang}`,
          visible: overlayPrefs.transliterationVisibility !== false,
          size: overlayPrefs.transliterationSize || overlayPrefs.textSize || 3,
        },
        {
          content: 'teeka-punjabi',
          visible: false,
          size: overlayPrefs.textSize || 3,
        },
      ];
    };

    const getContentText = (Line, contentId) => {
      if (!Line || !contentId) return '';
      if (contentId === 'translation-english') return Line.English || '';
      if (contentId === 'translation-hindi') return Line.Hindi || '';
      if (contentId === 'translation-spanish') return Line.Spanish || '';
      if (contentId === 'teeka-punjabi') return Line.Punjabi || '';
      if (contentId.startsWith('transliteration-') && Line.Transliteration) {
        if (typeof Line.Transliteration === 'string') {
          return contentId === 'transliteration-english' ? Line.Transliteration : '';
        }
        if (contentId === 'transliteration-english') return Line.Transliteration.English || '';
        if (contentId === 'transliteration-hindi') return Line.Transliteration.Devanagari || '';
        if (contentId === 'transliteration-punjabi') return Line.Transliteration.Shahmukhi || '';
      }
      return '';
    };

    const getContentMeta = (contentId) => {
      if (!contentId) return { typeClass: '', scriptClass: '', lang: 'en', useGurmukhiFont: false };
      if (contentId.startsWith('translation-')) {
        const lang = contentId.replace('translation-', '');
        return {
          typeClass: 'o-translation',
          scriptClass: lang === 'hindi' ? 'hindi' : lang === 'spanish' ? 'spanish' : '',
          lang: lang === 'hindi' ? 'hi' : lang === 'spanish' ? 'es' : 'en',
          useGurmukhiFont: false,
        };
      }
      if (contentId.startsWith('transliteration-')) {
        const lang = contentId.replace('transliteration-', '');
        return {
          typeClass: 'o-transliteration',
          scriptClass: lang === 'hindi' ? 'devanagari' : lang === 'punjabi' ? 'shahmukhi' : '',
          lang: lang === 'hindi' ? 'hi' : lang === 'punjabi' ? 'pa-Arab' : 'en',
          useGurmukhiFont: false,
        };
      }
      if (contentId.startsWith('teeka-')) {
        // Teeka is ASCII-encoded Gurmukhi — needs a Gurmukhi font face
        return {
          typeClass: 'o-teeka',
          scriptClass: 'gurmukhi',
          lang: 'pa',
          useGurmukhiFont: true,
        };
      }
      return { typeClass: '', scriptClass: '', lang: 'en', useGurmukhiFont: false };
    };

    const renderContentSlots = (Line) => {
      const slots = getContentSlots();
      const gurbaniFont =
        (overlayPrefs && overlayPrefs.gurbaniFont) || 'Gurbani Akhar';
      const textFont = (overlayPrefs && overlayPrefs.textFont) || 'Muli';

      document.querySelectorAll('.o-content-slot').forEach((slotEl) => {
        const index = Number(slotEl.dataset.slot) - 1;
        const slot = slots[index] || slots[0];
        const text = slot.visible ? getContentText(Line, slot.content) : '';
        const meta = getContentMeta(slot.content);

        slotEl.className = `o-content-slot ${meta.typeClass} ${meta.scriptClass}`.trim();
        slotEl.dataset.content = slot.content || '';
        slotEl.dataset.useGurmukhi = meta.useGurmukhiFont ? '1' : '0';
        slotEl.setAttribute('lang', meta.lang);
        slotEl.innerHTML = text;
        slotEl.style.display = slot.visible && text ? '' : 'none';
        slotEl.style.fontSize = `${slot.size}vh`;

        if (meta.useGurmukhiFont) {
          slotEl.style.fontFamily = gurbaniFont;
        } else if (meta.scriptClass === 'hindi' || meta.scriptClass === 'devanagari') {
          slotEl.style.fontFamily = '';
        } else {
          slotEl.style.fontFamily = textFont;
        }
      });
    };

    const writeLine = (Line, larivaar, larivaarAssist) => {
      lineBeforeAnnouncement = { Line, larivaar, larivaarAssist };
      getElements('.o-gurbani').setProperty(
        'innerHTML',
        assist(Line.Gurmukhi || '', larivaar, larivaarAssist),
      );
      renderContentSlots(Line);

      const hasVisibleContent = getContentSlots().some(
        (slot) => slot.visible && getContentText(Line, slot.content),
      );
      document.querySelector('.overlay-wrapper').hidden =
        Line.Gurmukhi === '' && !hasVisibleContent;
    };

    const writeText = (text, isGurmukhi, isAnnouncement) => {
      if (isAnnouncement && !isGurmukhi) {
        getElements('.o-gurbani').setProperty('innerHTML', '');
        document.querySelectorAll('.o-content-slot').forEach((slotEl, index) => {
          if (index === 0) {
            slotEl.className = 'o-content-slot o-translation';
            slotEl.innerHTML = `<span>${text}</span>`;
            slotEl.style.display = '';
          } else {
            slotEl.innerHTML = '';
            slotEl.style.display = 'none';
          }
        });
      } else {
        getElements('.o-gurbani').setProperty('innerHTML', `<span>${text}</span>`);
        document.querySelectorAll('.o-content-slot').forEach((slotEl) => {
          slotEl.innerHTML = '';
          slotEl.style.display = 'none';
        });
      }
    };

    const getTextSize = (sizeKey, fallback = 3) => {
      if (!overlayPrefs) return fallback;
      if (preview && overlayPrefs.fitTextSwitch) return fallback;
      const size = overlayPrefs[sizeKey];
      if (size !== undefined && size !== null) return size;
      return overlayPrefs.textSize || fallback;
    };

    const getSpacing = () => {
      // Prefer new controls; fall back to legacy single padding value
      const legacy = overlayPrefs.padding != null ? Number(overlayPrefs.padding) : 0.5;
      const horizontal =
        overlayPrefs.paddingHorizontal != null
          ? Number(overlayPrefs.paddingHorizontal)
          : 5;
      const vertical =
        overlayPrefs.paddingVertical != null
          ? Number(overlayPrefs.paddingVertical)
          : legacy;
      const lineSpacing =
        overlayPrefs.lineSpacing != null ? Number(overlayPrefs.lineSpacing) : 0.5;
      return {
        horizontal: Number.isFinite(horizontal) ? horizontal : 5,
        vertical: Number.isFinite(vertical) ? vertical : 0.5,
        lineSpacing: Number.isFinite(lineSpacing) ? lineSpacing : 0.5,
      };
    };

    const applySpacing = (layout) => {
      const { horizontal, vertical, lineSpacing } = getSpacing();
      // Only force compact padding for fit-text on top/bottom subtitle layouts.
      // Never lock spacing on split/fullscreen/classic/vertical (live browser).
      const useFitTextPad =
        !!overlayPrefs.fitTextSwitch && ['top', 'bottom'].includes(layout);
      const padY = useFitTextPad ? 1 : vertical;
      const padX = useFitTextPad ? 5 : horizontal;
      const boxPadding = `${padY}vh ${padX}%`;

      const layoutContainer = document.querySelector('.layout-top-bottom');
      const contentPanels = document.querySelectorAll('.content-top, .content-bottom');
      const overlayWrapper = document.querySelector('.overlay-wrapper');
      const contentBars = document.querySelectorAll('.content-bar');

      // Clear previous spacing / CSS defaults so controls are authoritative
      if (layoutContainer) {
        layoutContainer.style.padding = '0';
        layoutContainer.style.paddingTop = '0';
        layoutContainer.style.paddingBottom = '0';
        layoutContainer.style.paddingLeft = '0';
        layoutContainer.style.paddingRight = '0';
      }
      contentPanels.forEach((el) => {
        el.style.padding = '0';
      });
      contentBars.forEach((el) => {
        el.style.padding = '0';
      });
      if (overlayWrapper) {
        overlayWrapper.style.padding = '0';
        // Reset classic positioning overrides between layout switches
        if (layout !== 'classic') {
          overlayWrapper.style.left = '';
          overlayWrapper.style.width = '';
          overlayWrapper.style.bottom = '';
        }
      }
      document.querySelectorAll('.o-gurbani, .o-content-slot').forEach((el) => {
        el.style.marginTop = '0';
        el.style.marginBottom = '0';
        el.style.padding = '0';
      });

      // Line spacing: gap after gurbani and each visible content line
      const activeRoot = ['top', 'bottom'].includes(layout)
        ? document.querySelector('.layout-top-bottom')
        : document.querySelector('.other-layouts');
      if (activeRoot) {
        const visibleLines = [
          ...activeRoot.querySelectorAll('.o-gurbani, .o-content-slot'),
        ].filter((el) => el.style.display !== 'none' && el.innerHTML.trim());
        visibleLines.forEach((el, index) => {
          el.style.marginBottom =
            index < visibleLines.length - 1 ? `${lineSpacing}vh` : '0';
          if (!el.classList.contains('o-gurbani')) {
            el.style.display = 'block';
          }
        });
      }

      if (['top', 'bottom'].includes(layout)) {
        if (layoutContainer) {
          layoutContainer.style.paddingTop = `${padY}vh`;
          layoutContainer.style.paddingBottom = `${padY}vh`;
          layoutContainer.style.paddingLeft = `${padX}%`;
          layoutContainer.style.paddingRight = `${padX}%`;
        }
      } else if (layout === 'split') {
        contentPanels.forEach((el) => {
          el.style.paddingTop = `${padY}vh`;
          el.style.paddingBottom = `${padY}vh`;
          el.style.paddingLeft = `${padX}%`;
          el.style.paddingRight = `${padX}%`;
        });
      } else if (layout === 'fullscreen') {
        if (overlayWrapper) {
          overlayWrapper.style.paddingTop = `${padY}vh`;
          overlayWrapper.style.paddingBottom = `${padY}vh`;
          overlayWrapper.style.paddingLeft = `${padX}%`;
          overlayWrapper.style.paddingRight = `${padX}%`;
          overlayWrapper.style.boxSizing = 'border-box';
        }
        contentPanels.forEach((el) => {
          el.style.backgroundColor = 'transparent';
          el.style.padding = '0';
        });
      } else if (layout === 'classic') {
        contentPanels.forEach((el) => {
          el.style.backgroundColor = 'transparent';
          el.style.padding = '0';
        });
        const overlayBgColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${
          Number(overlayPrefs.greenScreenToggle) || overlayPrefs.bgOpacity
        })`;
        if (activeRoot) {
          activeRoot.querySelectorAll('span.o-gurbani, .o-content-slot').forEach((spanEl) => {
            if (spanEl.style.display === 'none' || !spanEl.innerHTML.trim()) return;
            spanEl.style.backgroundColor = overlayBgColor;
            spanEl.style.paddingTop = `${Math.max(padY, 0.3)}vh`;
            spanEl.style.paddingBottom = `${Math.max(padY, 0.3)}vh`;
            spanEl.style.paddingLeft = `${Math.max(padX * 0.3, 0.5)}vw`;
            spanEl.style.paddingRight = `${Math.max(padX * 0.3, 0.5)}vw`;
            spanEl.style.lineHeight = '1.5em';
          });
        }
        if (overlayWrapper) {
          overlayWrapper.style.left = `${padX}%`;
          overlayWrapper.style.width = `${Math.max(100 - padX * 2, 40)}%`;
          overlayWrapper.style.bottom = `${Math.max(padY * 2, 4)}%`;
          overlayWrapper.style.backgroundColor = 'transparent';
          overlayWrapper.style.padding = '0';
        }
      } else if (layout === 'vertical' || layout === 'vertical-left') {
        contentPanels.forEach((el) => {
          el.style.paddingTop = `${padY}vh`;
          el.style.paddingBottom = `${padY}vh`;
          el.style.paddingLeft = `${padX * 0.5}%`;
          el.style.paddingRight = `${padX * 0.5}%`;
          el.style.backgroundColor = 'transparent';
        });
        document
          .querySelectorAll(
            '.layout-vertical .overlay-wrapper, .layout-vertical-left .overlay-wrapper',
          )
          .forEach((el) => {
            el.style.width = `${Math.min(Math.max(padX * 2.5, 25), 70)}%`;
            el.style.paddingTop = `${padY}vh`;
            el.style.paddingBottom = `${padY}vh`;
            el.style.paddingLeft = '0';
            el.style.paddingRight = '0';
            el.style.boxSizing = 'border-box';
          });
      } else {
        // Fallback: apply box padding to both layout roots
        if (layoutContainer) layoutContainer.style.padding = boxPadding;
        contentPanels.forEach((el) => {
          el.style.padding = boxPadding;
        });
      }
    };

    const applyOverlayPrefs = () => {
      if (!overlayPrefs) return;

      const layout = overlayPrefs.layout || 'split';
      const overlayColor = overlayPrefs.greenScreenToggle ? '#0f0' : 'transparent';
      const bgOpacity = Number(overlayPrefs.greenScreenToggle) || overlayPrefs.bgOpacity;
      const slots = getContentSlots();
      const primarySize = slots[0] ? slots[0].size : getTextSize('textSize', 3);

      const layoutContainer = document.querySelector('.layout-top-bottom');
      layoutContainer.style.color = overlayPrefs.textColor;
      layoutContainer.style.fontSize = `${primarySize}vh`;
      layoutContainer.style.backgroundColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;

      document.querySelectorAll('.content-top, .content-bottom').forEach((el) => {
        el.style.color = overlayPrefs.textColor;
        el.style.fontSize = `${primarySize}vh`;
        el.style.backgroundColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;
      });

      document.querySelectorAll('.logo-wrapper').forEach((el) => {
        el.style.opacity = overlayPrefs.bgOpacity;
      });

      getElements('.o-gurbani').setProperty('color', overlayPrefs.gurbaniTextColor);
      getElements('.o-gurbani').setProperty(
        'fontSize',
        `${preview && overlayPrefs.fitTextSwitch ? 5 : overlayPrefs.gurbaniSize}vh`,
      );

      // Per-slot size/color
      document.querySelectorAll('.o-content-slot').forEach((slotEl) => {
        const index = Number(slotEl.dataset.slot) - 1;
        const slot = slots[index];
        if (slot) {
          slotEl.style.fontSize = `${slot.size}vh`;
        }
        slotEl.style.color = overlayPrefs.textColor;
      });

      if (!preview && ['top', 'bottom'].includes(layout)) {
        if (overlayPrefs.fitTextSwitch) {
          fitTextInstances = fitty('.layout-top-bottom .o-gurbani', {
            minSize: 18,
            maxSize: 36,
          });
          fitTextInstances.push(
            ...fitty('.layout-top-bottom .o-content-slot', {
              minSize: 14,
              maxSize: 24,
              multiLine: true,
            }),
          );
        } else if (fitTextInstances && fitTextInstances.length > 0) {
          fitTextInstances.forEach((instance) => {
            if (instance && instance.unsubscribe) instance.unsubscribe();
          });
          fitTextInstances = [];
          document.querySelectorAll('.layout-top-bottom .o-gurbani, .layout-top-bottom .o-content-slot').forEach((el) => {
            el.style.whiteSpace = 'normal';
          });
        }
      }

      document.body.classList.remove(
        'layout-top',
        'layout-bottom',
        'layout-split',
        'layout-classic',
        'layout-vertical',
        'layout-vertical-left',
        'layout-fullscreen',
      );

      const { gurbaniFont, textFont, toggleAnnouncement } = overlayPrefs;
      getElements('.o-gurbani').setProperty('fontFamily', gurbaniFont);
      document.querySelectorAll('.o-content-slot').forEach((el) => {
        if (el.dataset.useGurmukhi === '1' || el.classList.contains('o-teeka')) {
          el.style.fontFamily = gurbaniFont || 'Gurbani Akhar';
        } else if (el.classList.contains('hindi') || el.classList.contains('devanagari')) {
          el.style.fontFamily = '';
        } else {
          el.style.fontFamily = textFont;
        }
      });

      document.body.classList.add('layout-' + layout);

      if (['top', 'bottom'].includes(layout)) {
        document.querySelector('.layout-top-bottom').style.display = 'flex';
        document.querySelector('.other-layouts').style.display = 'none';
      } else {
        document.querySelector('.other-layouts').style.display = 'block';
        document.querySelector('.layout-top-bottom').style.display = 'none';
      }
      document.body.classList.toggle('logo-off', !overlayPrefs.toggleLogo);

      if (toggleAnnouncement && hasAnnouncement && Object.keys(lastAnnouncement).length) {
        const { text, isGurmukhi, isAnnouncement } = lastAnnouncement;
        writeText(text, isGurmukhi, isAnnouncement);
      } else if (Object.keys(lineBeforeAnnouncement).length) {
        const { Line, larivaar, larivaarAssist } = lineBeforeAnnouncement;
        writeLine(Line, larivaar, larivaarAssist);
      }

      document.querySelectorAll('.content-top, .content-bars-bottom').forEach(() => {
        document.querySelectorAll('span.o-gurbani, .o-content-slot').forEach((spanEl) => {
          if (!document.body.classList.contains('layout-classic')) {
            spanEl.style.backgroundColor = 'transparent';
          }
        });
        if (!document.body.classList.contains('layout-classic')) {
          document.querySelector('.overlay-wrapper').style.backgroundColor = 'transparent';
        }
      });

      // Vertical panel background
      document
        .querySelectorAll(
          '.layout-vertical .overlay-wrapper, .layout-vertical-left .overlay-wrapper',
        )
        .forEach((el) => {
          el.style.backgroundColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;
        });

      // Fullscreen background
      document.querySelectorAll('.layout-fullscreen .overlay-wrapper').forEach((el) => {
        el.style.backgroundColor = `rgba(${hexToRgb(overlayPrefs.bgColor)}, ${bgOpacity})`;
      });

      // Apply spacing last so nothing overrides it
      applySpacing(layout);

      document.body.style.backgroundColor = overlayColor;

      const textFormat = overlayPrefs.textFormat || { bold: false, italic: false };
      document.querySelectorAll('.o-content-slot').forEach((el) => {
        const isDevanagari =
          el.classList.contains('hindi') || el.classList.contains('devanagari');
        const isTeeka = el.classList.contains('o-teeka') || el.dataset.useGurmukhi === '1';
        if (isDevanagari || isTeeka) {
          el.style.fontWeight = 'normal';
          el.style.fontStyle = textFormat.italic ? 'italic' : 'normal';
          el.style.fontSynthesis = 'none';
        } else {
          el.style.fontWeight = textFormat.bold ? 900 : 400;
          el.style.fontStyle = textFormat.italic ? 'italic' : 'normal';
        }
      });

      // Hide/show verse text only — never clears theme background
      applyHideOverlayText();
    };

    // Only toggles verse text visibility. Theme / layout background is never removed.
    const applyHideOverlayText = () => {
      if (!overlayPrefs) return;
      const hideText =
        overlayPrefs.hideOverlayText === true || overlayPrefs.hideOverlayText === 'true';

      document.body.classList.toggle('hide-overlay-text', hideText);

      document.querySelectorAll('.o-gurbani, .o-content-slot').forEach((el) => {
        if (hideText) {
          el.style.setProperty('visibility', 'hidden', 'important');
          el.style.setProperty('opacity', '0', 'important');
          // Use visibility/opacity so layout + background bars stay painted
        } else {
          el.style.removeProperty('visibility');
          el.style.removeProperty('opacity');
        }
      });

      // Keep logo hidden with text so background stays clean for custom content
      document.querySelectorAll('.logo-wrapper').forEach((el) => {
        if (hideText) {
          el.style.setProperty('visibility', 'hidden', 'important');
          el.style.setProperty('opacity', '0', 'important');
        } else if (!overlayPrefs.toggleLogo) {
          el.style.setProperty('visibility', 'hidden', 'important');
          el.style.setProperty('opacity', '0', 'important');
        } else {
          el.style.removeProperty('visibility');
          el.style.removeProperty('opacity');
        }
      });
    };

    socket.on('show-line', (request) => {
      if (!preview) {
        const overlayLarivaar = overlayPrefs ? overlayPrefs.overlayLarivaar : false;
        const larivaarAssist = overlayPrefs ? overlayPrefs.larivaarAssist : false;
        // Always store the line; applyOverlayPrefs enforces hide-overlay-text if on
        writeLine(request.Line, overlayLarivaar, larivaarAssist);
        if (overlayPrefs) {
          applyOverlayPrefs();
        }
      }
    });

    socket.on('show-misc-text', (request) => {
      if (!preview && overlayPrefs) {
        const { text, isGurmukhi, isAnnouncement } = request;
        writeText(text, isGurmukhi, isAnnouncement);
        if (isAnnouncement) {
          hasAnnouncement = true;
          lastAnnouncement = { text, isGurmukhi, isAnnouncement };
        } else {
          hasAnnouncement = false;
        }
        applyOverlayPrefs();
      }
    });

    socket.on('update-prefs', (data) => {
      overlayPrefs = { ...(overlayPrefs || {}), ...data };
      applyOverlayPrefs();
    });

    // Dedicated event so presentation "Hide Overlay Text" always reaches live browser
    socket.on('hide-overlay-text', (hideText) => {
      overlayPrefs = { ...(overlayPrefs || {}), hideOverlayText: !!hideText };
      applyHideOverlayText();
    });
  </script>
